name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run offline tests and assert package contents
        run: npm run check

      - name: Read the exact Pi baseline
        id: baseline
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { validatePiVersion } from './scripts/release.mjs';
          const { piVersion } = JSON.parse(readFileSync('scripts/quality.json', 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${validatePiVersion(piVersion)}\n`);
          NODE

      - name: Install pinned Pi outside the checkout
        env:
          PI_VERSION: ${{ steps.baseline.outputs.version }}
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/pi-host"
          npm install --prefix "$install_dir" --ignore-scripts --no-audit --no-fund \
            "@earendil-works/pi-coding-agent@$PI_VERSION"
          test -x "$install_dir/node_modules/.bin/pi"
          printf 'PI_BIN=%s\n' "$install_dir/node_modules/.bin/pi" >> "$GITHUB_ENV"

      - name: Exercise checkout, headless mode, and packed package in real Pi
        env:
          PI_VERSION: ${{ steps.baseline.outputs.version }}
        run: npm run test:e2e

      - name: Summarize sanitized smoke evidence
        if: always()
        run: node scripts/summarize-e2e.mjs

      - name: Preserve sanitized smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-node-${{ matrix.node }}
          path: artifacts/e2e-result.json
          if-no-files-found: warn
          retention-days: 7
